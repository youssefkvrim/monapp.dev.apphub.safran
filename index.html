<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safran</title>
<style>
  :root { --bg: #fbfbf9; --ink: #000000; --blue: #0f3d83; --grey: #525668; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    touch-action: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .logo {
    position: fixed;
    top: 32px;
    left: 32px;
    height: 26px;
    width: auto;
    pointer-events: none;
    user-select: none;
  }
  .label {
    position: fixed;
    inset: 0;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    user-select: none;
    font: 400 11px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: 0.06em;
    color: var(--ink);
  }
</style>
</head>
<body>
<canvas></canvas>
<img class="logo" src="logo.png" alt="Safran">
<p class="label">[this is a testing page]</p>

<script>
(() => {
  const BG = [251 / 255, 251 / 255, 249 / 255];
  const BLUE = [15 / 255, 61 / 255, 131 / 255];

  const canvas = document.querySelector('canvas');
  const opts = { antialias: false, alpha: false, depth: false, stencil: false };
  const gl2 = canvas.getContext('webgl2', opts);
  const gl = gl2 || canvas.getContext('webgl', opts);
  if (!gl) return;

  let internalFormat = gl.RGBA;
  if (gl2) {
    if (!gl.getExtension('EXT_color_buffer_float')) return;
    internalFormat = gl.RGBA32F;
  } else {
    if (!gl.getExtension('OES_texture_float')) return;
    gl.getExtension('WEBGL_color_buffer_float');
  }

  const vertexSrc = `
    precision highp float;
    attribute vec2 a_position;
    uniform vec2 u_texel;
    varying vec2 vUv, vL, vR, vT, vB;
    void main () {
      vUv = .5 * (a_position + 1.);
      vL = vUv - vec2(u_texel.x, 0.);
      vR = vUv + vec2(u_texel.x, 0.);
      vT = vUv + vec2(0., u_texel.y);
      vB = vUv - vec2(0., u_texel.y);
      gl_Position = vec4(a_position, 0., 1.);
    }`;

  const bilerpSrc = `
    vec4 bilerp (sampler2D sam, vec2 uv, vec2 tsize) {
      vec2 st = uv / tsize - 0.5;
      vec2 iuv = floor(st);
      vec2 fuv = fract(st);
      vec4 a = texture2D(sam, (iuv + vec2(0.5, 0.5)) * tsize);
      vec4 b = texture2D(sam, (iuv + vec2(1.5, 0.5)) * tsize);
      vec4 c = texture2D(sam, (iuv + vec2(0.5, 1.5)) * tsize);
      vec4 d = texture2D(sam, (iuv + vec2(1.5, 1.5)) * tsize);
      return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);
    }`;

  const head = `precision highp float; precision highp sampler2D;
    varying vec2 vUv, vL, vR, vT, vB;`;

  const programs = {
    splat: build(`${head}
      uniform sampler2D u_target;
      uniform float u_ratio;
      uniform vec2 u_point;
      uniform vec3 u_value;
      uniform float u_size;
      void main () {
        vec2 p = vUv - u_point;
        p.x *= u_ratio;
        vec3 splat = exp(-dot(p, p) / u_size) * u_value;
        gl_FragColor = vec4(texture2D(u_target, vUv).xyz + splat, 1.);
      }`),
    divergence: build(`${head}
      uniform sampler2D u_velocity;
      void main () {
        float L = texture2D(u_velocity, vL).x;
        float R = texture2D(u_velocity, vR).x;
        float T = texture2D(u_velocity, vT).y;
        float B = texture2D(u_velocity, vB).y;
        gl_FragColor = vec4(.6 * (R - L + T - B), 0., 0., 1.);
      }`),
    pressure: build(`${head}
      uniform sampler2D u_pressure;
      uniform sampler2D u_divergence;
      void main () {
        float L = texture2D(u_pressure, vL).x;
        float R = texture2D(u_pressure, vR).x;
        float T = texture2D(u_pressure, vT).x;
        float B = texture2D(u_pressure, vB).x;
        float div = texture2D(u_divergence, vUv).x;
        gl_FragColor = vec4((L + R + B + T - div) * 0.25, 0., 0., 1.);
      }`),
    gradient: build(`${head}
      uniform sampler2D u_pressure;
      uniform sampler2D u_velocity;
      void main () {
        float L = texture2D(u_pressure, vL).x;
        float R = texture2D(u_pressure, vR).x;
        float T = texture2D(u_pressure, vT).x;
        float B = texture2D(u_pressure, vB).x;
        vec2 v = texture2D(u_velocity, vUv).xy - vec2(R - L, T - B);
        gl_FragColor = vec4(v, 0., 1.);
      }`),
    advect: build(`${head}
      uniform sampler2D u_velocity;
      uniform sampler2D u_source;
      uniform vec2 u_texel;
      uniform float u_dt;
      uniform float u_dissipation;
      ${bilerpSrc}
      void main () {
        vec2 coord = vUv - u_dt * bilerp(u_velocity, vUv, u_texel).xy * u_texel;
        gl_FragColor = vec4(u_dissipation * bilerp(u_source, coord, u_texel).xyz, 1.);
      }`),
    display: build(`${head}
      uniform sampler2D u_density;
      uniform vec2 u_texel;
      uniform vec3 u_bg;
      uniform vec3 u_ink;
      ${bilerpSrc}
      void main () {
        float d = clamp(bilerp(u_density, vUv, u_texel).x, 0., 1.);
        d = smoothstep(0., 1., d);
        gl_FragColor = vec4(mix(u_bg, u_ink, d), 1.);
      }`),
  };

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  }

  function build(fragSrc) {
    const program = gl.createProgram();
    gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSrc));
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragSrc));
    gl.bindAttribLocation(program, 0, 'a_position');
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(program));
    const uniforms = {};
    const n = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const name = gl.getActiveUniform(program, i).name;
      uniforms[name] = gl.getUniformLocation(program, name);
    }
    return { program, uniforms };
  }

  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.enableVertexAttribArray(0);

  function createFBO(w, h) {
    const texture = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, gl.RGBA, gl.FLOAT, null);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    return {
      fbo, width: w, height: h,
      attach(id) {
        gl.activeTexture(gl.TEXTURE0 + id);
        gl.bindTexture(gl.TEXTURE_2D, texture);
        return id;
      },
    };
  }

  function createDoubleFBO(w, h) {
    let a = createFBO(w, h);
    let b = createFBO(w, h);
    return {
      texel: [1 / w, 1 / h],
      read: () => a,
      write: () => b,
      swap() { [a, b] = [b, a]; },
    };
  }

  let velocity, density, divergence, pressure;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    const w = Math.max(2, Math.floor(window.innerWidth / 2));
    const h = Math.max(2, Math.floor(window.innerHeight / 2));
    velocity = createDoubleFBO(w, h);
    density = createDoubleFBO(w, h);
    divergence = createFBO(w, h);
    pressure = createDoubleFBO(w, h);
  }

  function blit(target) {
    if (target) {
      gl.viewport(0, 0, target.width, target.height);
      gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    } else {
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    }
    gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
  }

  const pointer = { x: 0, y: 0, px: 0, py: 0, moved: false, ready: false };

  function onMove(x, y) {
    if (!pointer.ready) {
      pointer.ready = true;
      pointer.px = x;
      pointer.py = y;
    }
    pointer.x = x;
    pointer.y = y;
    pointer.moved = true;
  }

  window.addEventListener('pointermove', (e) => onMove(e.clientX, e.clientY));
  window.addEventListener('resize', resize);

  function splat(target, value) {
    const p = programs.splat;
    gl.useProgram(p.program);
    gl.uniform2f(p.uniforms.u_texel, target.texel[0], target.texel[1]);
    gl.uniform1i(p.uniforms.u_target, target.read().attach(1));
    gl.uniform1f(p.uniforms.u_ratio, window.innerWidth / window.innerHeight);
    gl.uniform2f(p.uniforms.u_point, pointer.x / window.innerWidth, 1 - pointer.y / window.innerHeight);
    gl.uniform3f(p.uniforms.u_value, value[0], value[1], value[2]);
    gl.uniform1f(p.uniforms.u_size, 0.0015);
    blit(target.write());
    target.swap();
  }

  function advect(target, dissipation) {
    const p = programs.advect;
    gl.useProgram(p.program);
    gl.uniform2f(p.uniforms.u_texel, velocity.texel[0], velocity.texel[1]);
    gl.uniform1i(p.uniforms.u_velocity, velocity.read().attach(1));
    gl.uniform1i(p.uniforms.u_source, target.read().attach(2));
    gl.uniform1f(p.uniforms.u_dt, 1 / 60);
    gl.uniform1f(p.uniforms.u_dissipation, dissipation);
    blit(target.write());
    target.swap();
  }

  function frame() {
    if (pointer.moved) {
      pointer.moved = false;
      const dx = 5 * (pointer.x - pointer.px);
      const dy = 5 * (pointer.y - pointer.py);
      pointer.px = pointer.x;
      pointer.py = pointer.y;
      const amount = Math.min(Math.hypot(dx, dy) * 0.005, 0.35);
      splat(velocity, [dx, -dy, 0]);
      splat(density, [amount, amount, amount]);
    }

    let p = programs.divergence;
    gl.useProgram(p.program);
    gl.uniform2f(p.uniforms.u_texel, velocity.texel[0], velocity.texel[1]);
    gl.uniform1i(p.uniforms.u_velocity, velocity.read().attach(1));
    blit(divergence);

    p = programs.pressure;
    gl.useProgram(p.program);
    gl.uniform2f(p.uniforms.u_texel, velocity.texel[0], velocity.texel[1]);
    gl.uniform1i(p.uniforms.u_divergence, divergence.attach(1));
    for (let i = 0; i < 20; i++) {
      gl.uniform1i(p.uniforms.u_pressure, pressure.read().attach(2));
      blit(pressure.write());
      pressure.swap();
    }

    p = programs.gradient;
    gl.useProgram(p.program);
    gl.uniform2f(p.uniforms.u_texel, velocity.texel[0], velocity.texel[1]);
    gl.uniform1i(p.uniforms.u_pressure, pressure.read().attach(1));
    gl.uniform1i(p.uniforms.u_velocity, velocity.read().attach(2));
    blit(velocity.write());
    velocity.swap();

    advect(velocity, 0.97);
    advect(density, 0.968);

    p = programs.display;
    gl.useProgram(p.program);
    gl.uniform2f(p.uniforms.u_texel, density.texel[0], density.texel[1]);
    gl.uniform1i(p.uniforms.u_density, density.read().attach(1));
    gl.uniform3f(p.uniforms.u_bg, BG[0], BG[1], BG[2]);
    gl.uniform3f(p.uniforms.u_ink, BLUE[0], BLUE[1], BLUE[2]);
    blit(null);

    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
